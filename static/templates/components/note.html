<li class="card note-card{favorite_class}">
  <span class="note-pin" aria-hidden="true"></span>
  <span class="favorite-indicator" aria-label="Nota favoritada">★ Favorita</span>
  <h3>{title}</h3>
  <p>{details}</p>
  <div class="note-actions">
    <form action="/delete" method="POST">
      <input type="hidden" name="id" value="{id}">
      <button type="submit" name='delete_button'>Deletar</button>
    </form>
    <a class="edit-button" href="/update/{id}" name="edit_button">Editar</a>
    <form action="/favorite" method="POST">
      <input type="hidden" name="id" value="{id}">
      <button type="submit" name="favorite_button" aria-pressed="{favorite_state}">{favorite_label}</button>
    </form>
  </div>
</li>
