<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get-it: organize suas ideias e tarefas em notas rápidas.">
  <title>Get-it | Suas notas</title>
  <link rel="stylesheet" href="{{{{ url_for('static', filename='css/getit.css') }}}}">
  <script src="{{{{ url_for('static', filename='js/getit.js') }}}}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <img class="logo" src="{{{{ url_for('static', filename='img/logo-getit.png') }}}}" alt="Get-it">
      <div>
        <p class="eyebrow">Seu espaço de ideias</p>
        <h1>Como o Post-it, mas com outro verbo.</h1>
        <p class="subtitle">Registre agora. Lembre depois.</p>
      </div>
    </div>
  </header>

  <main class="page-container">
    <section class="note-form-section" aria-labelledby="new-note-title">
      <div class="section-heading">
        <div>
          <h2 id="new-note-title">Criar uma nota</h2>
          <p>Adicione uma ideia, lembrete ou tarefa.</p>
        </div>
      </div>

      <form class="note-form" action="/submit" method="POST">
        <div class="form-field">
          <label for="titulo">Título</label>
          <input id="titulo" type="text" name="titulo" placeholder="Ex.: Estudar para a prova" required>
        </div>

        <div class="form-field">
          <label for="detalhes">Detalhes</label>
          <textarea id="detalhes" name="detalhes" rows="4" placeholder="Escreva os detalhes da sua nota..." required></textarea>
        </div>

        <button class="submit-button" type="submit">Adicionar nota</button>
      </form>
    </section>

    <section class="notes-section" aria-labelledby="notes-title">
      <div class="notes-heading">
        <div>
          <p class="eyebrow">Seu mural</p>
          <h2 id="notes-title">Notas salvas</h2>
        </div>
      </div>

      <ul class="notes-grid">
        {notes}
      </ul>
    </section>
  </main>
  
</body>
</html>
